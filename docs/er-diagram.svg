<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="12">
  <defs><style>
    .e{fill:#fff;stroke:#64748b;stroke-width:1.2}
    .hd{font-weight:700;font-size:13.5px;fill:#fff}
    .k{fill:#0f172a;font-weight:600}.a{fill:#334155}.r{stroke:#334155;stroke-width:1.3;fill:none}
    .c{font-size:11px;fill:#b45309;font-weight:700}.l{font-size:11px;fill:#475569;font-style:italic}
  </style></defs>
  <rect width="1400" height="760" fill="#f8fafc"/>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#0f172a">Data model (ER diagram) — entities, keys, relationships and owning service</text>
  <text x="24" y="54" fill="#475569">PK = partition key, SK = sort key, GSI = global secondary index. Colours: grey = identity/shared, teal = Class &amp; Schedule, blue = Booking &amp; Waitlist, purple = Attendance &amp; Reliability.</text>

  <!-- USER -->
  <rect x="30" y="300" width="220" height="150" class="e"/><rect x="30" y="300" width="220" height="26" fill="#475569"/>
  <text x="40" y="318" class="hd">User (gym-users)</text>
  <text x="40" y="344" class="k">PK userId (Cognito sub)</text><text x="40" y="362" class="a">name, email</text><text x="40" y="380" class="a">role: member|trainer|admin</text><text x="40" y="398" class="a">status: active|disabled</text><text x="40" y="416" class="a">createdAt, updatedAt</text>
  <text x="40" y="440" class="l">Identity (shared)</text>

  <!-- AUDIT -->
  <rect x="30" y="560" width="220" height="150" class="e"/><rect x="30" y="560" width="220" height="26" fill="#475569"/>
  <text x="40" y="578" class="hd">AuditEntry (gym-audit)</text>
  <text x="40" y="604" class="k">PK day  SK at#uuid</text><text x="40" y="622" class="a">service, action, outcome</text><text x="40" y="640" class="a">actorId → User, actorRole</text><text x="40" y="658" class="a">targetType, targetId, details</text><text x="40" y="676" class="a">expiresAt (TTL 180 d)</text>
  <text x="40" y="700" class="l">Shared, append-only</text>

  <!-- STUDIO / CLASS -->
  <rect x="330" y="80" width="230" height="130" class="e"/><rect x="330" y="80" width="230" height="26" fill="#0f766e"/>
  <text x="340" y="98" class="hd">Studio (gym-studios)</text>
  <text x="340" y="124" class="k">PK studioId</text><text x="340" y="142" class="a">name, capacity, location</text><text x="340" y="160" class="a">status</text>
  <text x="340" y="196" class="l">Class &amp; Schedule</text>

  <rect x="330" y="270" width="250" height="230" class="e"/><rect x="330" y="270" width="250" height="26" fill="#0f766e"/>
  <text x="340" y="288" class="hd">ClassSession (gym-classes)</text>
  <text x="340" y="314" class="k">PK classId</text><text x="340" y="332" class="a">title, category, description</text><text x="340" y="350" class="a">trainerId → User (trainer)</text><text x="340" y="368" class="a">studioId → Studio</text><text x="340" y="386" class="a">startTime, endTime, durationMin</text><text x="340" y="404" class="a">capacity, status, version</text><text x="340" y="422" class="a">seriesId, holidayCheck</text><text x="340" y="440" class="a">GSI byTrainer / byStudio / byStatus</text>
  <text x="340" y="486" class="l">Class &amp; Schedule</text>

  <!-- BOOKING -->
  <rect x="680" y="80" width="250" height="200" class="e"/><rect x="680" y="80" width="250" height="26" fill="#1d4ed8"/>
  <text x="690" y="98" class="hd">Booking (gym-bookings)</text>
  <text x="690" y="124" class="k">PK bookingId = classId#memberId</text><text x="690" y="142" class="a">classId → ClassSession</text><text x="690" y="160" class="a">memberId → User (member)</text><text x="690" y="178" class="a">status: CONFIRMED | CANCELLED |</text><text x="690" y="196" class="a">  LATE_CANCELLED | CANCELLED_BY_GYM</text><text x="690" y="214" class="a">source: DIRECT | WAITLIST</text><text x="690" y="232" class="a">classStart (snapshot), createdAt</text><text x="690" y="250" class="a">GSI byClass, byMember</text>
  <text x="690" y="270" class="l">Booking &amp; Waitlist</text>

  <rect x="680" y="320" width="250" height="110" class="e"/><rect x="680" y="320" width="250" height="26" fill="#1d4ed8"/>
  <text x="690" y="338" class="hd">SeatCounter (gym-class-seats)</text>
  <text x="690" y="364" class="k">PK classId → ClassSession (1:1)</text><text x="690" y="382" class="a">booked, waitlistCount</text><text x="690" y="400" class="a">conditional writes = no overbooking</text>
  <text x="690" y="420" class="l">Booking &amp; Waitlist</text>

  <rect x="680" y="470" width="250" height="110" class="e"/><rect x="680" y="470" width="250" height="26" fill="#1d4ed8"/>
  <text x="690" y="488" class="hd">WaitlistEntry (gym-waitlist)</text>
  <text x="690" y="514" class="k">PK classId  SK memberId</text><text x="690" y="532" class="a">joinedAt (FIFO order)</text><text x="690" y="550" class="a">GSI byMember</text>
  <text x="690" y="570" class="l">Booking &amp; Waitlist</text>

  <rect x="680" y="620" width="250" height="110" class="e"/><rect x="680" y="620" width="250" height="26" fill="#1d4ed8"/>
  <text x="690" y="638" class="hd">Notification (gym-notifications)</text>
  <text x="690" y="664" class="k">PK memberId  SK at#uuid</text><text x="690" y="682" class="a">kind, title, message, classId</text><text x="690" y="700" class="a">emailStatus (Brevo), TTL 60 d</text>

  <!-- ATTENDANCE -->
  <rect x="1030" y="80" width="360" height="170" class="e"/><rect x="1030" y="80" width="360" height="26" fill="#7c3aed"/>
  <text x="1040" y="98" class="hd">AttendanceRecord (gym-attendance)</text>
  <text x="1040" y="124" class="k">PK classId  SK memberId</text><text x="1040" y="142" class="a">bookingId → Booking (1:0..1)</text><text x="1040" y="160" class="a">status: PRESENT | LATE | EXCUSED | NO_SHOW</text><text x="1040" y="178" class="a">method: TRAINER | CODE | AUTO_CLOSE | ADMIN_FIX</text><text x="1040" y="196" class="a">recordedBy → User, recordedAt</text><text x="1040" y="214" class="a">GSI byMember</text>
  <text x="1040" y="238" class="l">Attendance &amp; Reliability</text>

  <rect x="1030" y="290" width="360" height="130" class="e"/><rect x="1030" y="290" width="360" height="26" fill="#7c3aed"/>
  <text x="1040" y="308" class="hd">AttendanceSession (gym-attendance-sessions)</text>
  <text x="1040" y="334" class="k">PK "SESSION#classId" (1:1 ClassSession)</text><text x="1040" y="352" class="a">codeHash (SHA-256), codeExpiresAt</text><text x="1040" y="370" class="a">closedAt, closedBy, summary</text><text x="1040" y="388" class="a">"ATTEMPT#classId#memberId": wrong-code count (TTL)</text>

  <rect x="1030" y="460" width="360" height="120" class="e"/><rect x="1030" y="460" width="360" height="26" fill="#7c3aed"/>
  <text x="1040" y="478" class="hd">Strike (gym-strikes)</text>
  <text x="1040" y="504" class="k">PK memberId  SK type#classId</text><text x="1040" y="522" class="a">type: NO_SHOW | LATE_CANCEL, at</text><text x="1040" y="540" class="a">expiresAt (TTL 30 d = rolling window)</text>

  <rect x="1030" y="620" width="360" height="110" class="e"/><rect x="1030" y="620" width="360" height="26" fill="#7c3aed"/>
  <text x="1040" y="638" class="hd">MemberStanding (gym-member-standing)</text>
  <text x="1040" y="664" class="k">PK memberId → User (1:0..1)</text><text x="1040" y="682" class="a">suspendedUntil, reason, liftedBy</text>

  <!-- relationships -->
  <path d="M445 210 V268" class="r"/><text x="452" y="232" class="c">1</text><text x="452" y="262" class="c">N</text><text x="462" y="248" class="l">hosts</text>
  <path d="M250 360 H328" class="r"/><text x="256" y="354" class="c">1</text><text x="312" y="354" class="c">N</text><text x="262" y="374" class="l">teaches</text>
  <path d="M580 300 H620 V180 H678" class="r"/><text x="586" y="294" class="c">1</text><text x="660" y="174" class="c">N</text><text x="590" y="240" class="l">has</text>
  <path d="M580 380 H678" class="r"/><text x="586" y="374" class="c">1</text><text x="660" y="374" class="c">1</text>
  <path d="M580 485 H620 V525 H678" class="r"/><text x="586" y="479" class="c">1</text><text x="660" y="519" class="c">N</text><text x="590" y="500" class="l">queues</text>
  <path d="M140 300 V68 H805 V78" class="r"/><text x="148" y="292" class="c">1</text><text x="812" y="76" class="c">N</text><text x="600" y="64" class="l">member makes bookings</text>
  <path d="M930 160 H1028" class="r"/><text x="936" y="154" class="c">1</text><text x="1006" y="154" class="c">0..1</text><text x="950" y="176" class="l">attended as</text>
  <path d="M250 430 H275 V748 H1005 V520 H1028" class="r"/><path d="M1005 680 H1028" class="r"/><text x="256" y="424" class="c">1</text><text x="1008" y="514" class="c">N</text><text x="1008" y="674" class="c">0..1</text><text x="420" y="742" class="l">member accumulates strikes / has a standing</text>
  <path d="M580 450 H1010 V355 H1028" class="r"/><text x="586" y="444" class="c">1</text><text x="1014" y="349" class="c">1</text>
  
</svg>
